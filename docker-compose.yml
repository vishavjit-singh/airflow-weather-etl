# Airflow (LocalExecutor) + PostgreSQL.
#   docker compose up --build        → UI on http://localhost:8080 (admin / admin), DAG weather_etl
# WEATHER_SOURCE=api calls the real Open-Meteo archive; set it to "fixture" for an offline, deterministic run.
name: airflow-weather-etl

x-airflow: &airflow
  build: .
  image: airflow-weather-etl:latest
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "true"
    AIRFLOW_CONN_WEATHER_DB: postgresql://airflow:airflow@postgres:5432/weather
    WEATHER_SOURCE: ${WEATHER_SOURCE:-api}
    WEATHER_RAW_DIR: /opt/airflow/data/raw
  volumes:
    - ./data:/opt/airflow/data

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
        airflow pools set open_meteo_api 2 "Open-Meteo free tier: at most 2 concurrent calls"

  scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  webserver:
    <<: *airflow
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
